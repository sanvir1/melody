<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список файлов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #file-frame {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Список файлов</h1>
        <ul id="file-list" class="list-group">
            <!-- Статичный список файлов -->
            <li class="list-group-item" style="cursor: pointer;" onclick="loadFile('file1.html')">file1.html</li>
            <li class="list-group-item" style="cursor: pointer;" onclick="loadFile('file2.html')">file2.html</li>
            <li class="list-group-item" style="cursor: pointer;" onclick="loadFile('file3.html')">file3.html</li>
        </ul>
        <iframe id="file-frame" src="" frameborder="0"></iframe>
    </div>

    <script>
        // Функция для загрузки файла во фрейм
        function loadFile(filename) {
            document.getElementById('file-frame').src = `vers/${filename}`;
        }
    </script>
</body>
</html>
